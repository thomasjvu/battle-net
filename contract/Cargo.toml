[package]
name = "battle-net-economy"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
